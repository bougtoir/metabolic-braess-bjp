# Common result schema v1 — results/common_metrics/common_metrics_<system>.csv
# Every system exports one CSV with EXACTLY these columns, in this order.
# Use NA where a metric is scientifically inapplicable. Never fabricate
# translated values.
columns:
  - system                  # dinosaur | cenozoic | quaternary | ancient_marine | modern_terrestrial | modern_marine
  - era                     # e.g. Late Jurassic, Miocene-Pliocene, Quaternary, Paleozoic-Mesozoic marine, modern
  - environment_type        # terrestrial | marine
  - data_type               # fossil_occurrence | survey_panel | telemetry | matched_survey | positive_control
  - region                  # e.g. Morrison Formation (western NA), North America, California Current
  - time_interval           # e.g. "156.3-146.8 Ma", "23-5 Ma", "modern"
  - lower_trophic_definition# e.g. "Sauropoda+Ornithischia", "herbivorous mammals", "krill/zooplankton"
  - higher_trophic_definition # e.g. "Theropoda", "Carnivora", "seabirds/whales/tunas"
  - metric                  # core metric id: delta_beta_simpson | delta_beta_sorensen | range_extent_contrast |
                            #   mantel_r_herbivore | mantel_r_predator | mantel_r_contrast | temporal_lag |
                            #   sampling_pool_sensitivity | time_aggregation_sensitivity | null_* |
                            #   occupancy_persistence | abundance_state_dependence | trophic_propagation_* ...
  - effect_estimate         # native estimate (NA if none)
  - effect_scale            # native units / estimator label, e.g. "Simpson turnover diff", "log-count", "km", "standardized_mean_difference"
  - lower_ci                # 95% CI low (NA if none)
  - upper_ci
  - p_value                 # NA if none; for Δβ rows report P(effect>0) where that is the pre-registered test
  - sample_size             # n collections / routes / units (define in notes)
  - effect_direction        # lower>higher | lower<higher | no detectable contrast | NA
  - standardized_effect     # comparable magnitude where defensible; else NA
  - sampling_pool_sensitivity  # effect_restricted - effect_reference (Δ on this row's metric), NA otherwise
  - time_aggregation_sensitivity # effect_coarse - effect_fine, NA otherwise
  - distance_decay_effect   # Mantel r or decay slope relevant to this metric, NA otherwise
  - temporal_lag            # higher-trophic lag - lower-trophic lag, NA otherwise
  - observation_bias_score  # 0-1 system-defined score or NA (justify in adapter OBSERVATION_MODEL.md)
  - robustness_class        # A strong | B partial | C context-dependent | D failed | NA
  - analysis_script         # repo-relative path of the script that produces this row's inputs
  - data_source             # citation / DOI / API
  - notes                   # free text; keep short
rules:
  - one row per (metric × variant × sensitivity stratum)
  - native metrics are never pooled across systems; Tier-3 synthesis uses only standardized_effect / effect_direction
  - every numeric cell must be regenerated by analysis_script, never hand-written
