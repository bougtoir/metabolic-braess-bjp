system: cenozoic
tier: strict_replication
era: Cenozoic (Miocene-Pliocene)
environment_type: terrestrial
data_type: fossil_occurrence
region: North America (PBDB cc=NOA)
time_interval: "23-5 Ma"          # configurable: early_ma=23, late_ma=5
pbdb:
  base: "https://paleobiodb.org/data1.2"
  cc: NOA
  max_ma: 23.0
  min_ma: 5.0
  base_name: Mammalia
  env_exclude: [marine]           # keep terrestrial collections (env !~ marine)
guilds:
  herbivore_orders: [Artiodactyla, Perissodactyla, Proboscidea, Lagomorpha, Rodentia, Edentata, Tubulidentata, Hyracoidea]
  predator_order: Carnivora
  predator_exclude_families: [Phocidae, Otariidae, Odobenidae, Mustelidae_marine]  # pinnipeds excluded (marine)
taxonomic_resolution: genus
spatial_unit: collection
temporal_unit: pooled_interval
seeds:
  beta_diversity: 20240920
  sampling_bias: 20240921
n_bootstrap: 999
n_mantel_perm: 9999
dist_bin_km: 100
sampling_corrections: [raw, no_dominant_quarries, no_singletons, equalized_collections, spatial_thinning_1deg]
aggregation_ladder: [pooled, epoch, subepoch, ma1]
