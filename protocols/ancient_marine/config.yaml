system: ancient_marine
tier: ecological_translation
era: Paleozoic-Mesozoic marine (exact interval set by the implementation session)
environment_type: marine
data_type: fossil_occurrence
region: configurable (basin / palaeogeographic province)
time_interval: configurable
spatial_unit_candidates: [palaeogeographic_grid, basin, shelf_region, palaeolatitude_band, depositional_province]
trophic_mapping:
